services:
  snow:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: snow
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DEVICES_FILE: /app/personal/devices.yaml
      PCS_FILE: /app/personal/pcs.yaml
    volumes:
      - ./data:/app/data
      - ./personal:/app/personal:ro
    extra_hosts:
      # HA on host: set HA_URL=http://host.docker.internal:8123
      # or use LAN IP e.g. http://192.168.1.13:8123
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # Acer 8GB soft caps — adjust if needed
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
